name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST
    # 11:59 PM IST = 18:29 UTC
    - cron: '29 18 * * 4'

  # Allows manual trigger from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Report Branch
        run: |
          REPORT_DATE=$(date -u +"%Y-%m-%d")
          BRANCH_NAME="automation/weekly-report-${REPORT_DATE}-${GITHUB_RUN_ID}"

          echo "REPORT_BRANCH=${BRANCH_NAME}" >> "$GITHUB_ENV"

          git checkout -b "$BRANCH_NAME"

      - name: Commit Weekly Report
        run: |
          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No report changes found."
            echo "NO_REPORT_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -m "docs: add weekly Form-3 progress report [skip ci]"
            echo "NO_REPORT_CHANGES=false" >> "$GITHUB_ENV"
          fi

      - name: Push Report Branch
        if: env.NO_REPORT_CHANGES != 'true'
        run: |
          git push origin "${REPORT_BRANCH}"

      - name: Create Pull Request
        if: env.NO_REPORT_CHANGES != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${REPORT_BRANCH}" \
            --title "docs: Weekly Form-3 Progress Report" \
            --body "## Weekly Form-3 Progress Report

          This PR was automatically generated by GitHub Actions.

          ### Workflow
          - Generated weekly Form-3 PDF
          - Created an automated report branch
          - Added the report to \`weekly_reports/\`
          - Opened this PR for review

          Please review and merge after verification."

      - name: Report Summary
        run: |
          if [ "${NO_REPORT_CHANGES}" = "true" ]; then
            echo "No new report changes were found."
          else
            echo "Weekly report PR created successfully."
            echo "Branch: ${REPORT_BRANCH}"
          fi
