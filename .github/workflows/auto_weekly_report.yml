name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST
    # 11:59 PM IST = 18:29 UTC
    - cron: '29 18 * * 4'

  # Allows manual trigger from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      - name: Commit Weekly Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "docs: archive Form-3 weekly progress report [skip ci]"
            git push
          fi
